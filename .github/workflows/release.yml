name: release
on:
  push:
    tags: ["market-*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: node build/generate.mjs
      - run: node build/validate.mjs
      - run: zip -qr dsh-nano-market-index.zip dist
      - name: Create version-pinned release (audit trail)
        uses: softprops/action-gh-release@v2
        with:
          files: "dsh-nano-market-index.zip"
          body: "dsh-nano-market index at ${{ github.ref_name }} - this Release pins the exact index document (SHA ${{ github.sha }})."
