name: release
on:
  push:
    tags: ["market-*"]

# Semantic releases only (docs/versioning.md): market-* tags mark pipeline/redline/format changes.
# Data refreshes (catalog commits) deploy to Pages WITHOUT a tag — no version, by design.
# Audit trail = git: every catalog line carries a 40-hex pin; any historical index is reproducible
# by checking out that commit and running "npm ci && npm run build && npm run validate".

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # hard guard: only market-* tags ever run this job, no matter how the workflow was triggered
    if: startsWith(github.ref, 'refs/tags/market-')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm install
      - run: npm run ci
      - name: Create semantic release
        run: |
          gh release create "${{ github.ref_name }}" \\
            --title "market ${{ github.ref_name }}" \\
            --notes "Semantic release: pipeline/redline/format change. Data refreshes are unversioned (docs/versioning.md). Historical index reproducible: git checkout ${{ github.ref_name }} and run npm ci, npm run build, npm run validate."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
