name: publish
on:
  push:
    branches: [main]
  # PRs get the full check (test + build + strict validate) without deploying;
  # nothing is required, so a red check never blocks the merge (no false block).
  pull_request: {}
permissions:
  contents: read
concurrency:
  # per-ref group: a PR check run must not cancel an in-flight main deploy (cancel caused the 2026-10-23 Pages 404)
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      - run: node build/generate.mjs
      - run: node build/validate.mjs
      - name: Fail build on dry-run-only output
        run: test ! -f dist/index.json || ! grep -q '0.0.0-dry' dist/index.json || { echo 'index contains unresolved dry-run entries'; exit 1; }
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    needs: build
    # deploy only on real main pushes, never on PR runs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages
