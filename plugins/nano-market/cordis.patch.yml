# bundle layer for @oh-summy/nano-market: adds the "Nano Market" tab to the
# Plugins page. The tab lists every plugin registered in this market; each
# plugin is toggled on or off and updated in place (installing this market
# installs all of its plugins). The page itself is browser-side; this bundle
# only makes the plugin installed and listed.
- insert:
    - id: nano-market
      name: "@oh-summy/nano-market"
