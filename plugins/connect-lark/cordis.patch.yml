# bundle layer for @oh-summy/connect-lark: applied automatically when the bundle is
# listed in a profile's dsh.profile.bundles. enabled=false keeps it idle; flip to true
# (then restart the host) to start the Feishu long connection.
# NOTE: both senderAllowlist and groupAllowlist must be non-empty to enable messaging.
- insert:
    - id: connect-lark
      name: '@oh-summy/connect-lark'
      config:
        enabled: false
        appId: ''
        appSecretRef: CONNECT_LARK_APP_SECRET
        defaultPath: ''
        openId: ''
        domain: feishu
        requireMention: true
        # Agent ownership: attach-gui (default) reuses host agent;
        # owned-per-chat creates a new agent per chat (requires provider+model).
        agentOwnership: attach-gui
        attachSessionId: ''
        provider: ''
        model: ''
        # Fail-closed: both lists must be non-empty. Empty = deny all for that dimension.
        senderAllowlist: []
        groupAllowlist: []
        # CoT policy: stream-only (no thinking display).
        thinkingPolicy: stream-only
